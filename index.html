<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 霓虹桌面时钟</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0d0224; /* 深夜蓝/紫，赛博朋克背景 */
            font-family: 'Orbitron', sans-serif; /* 使用更具未来感的字体 */
            color: #00ffff; /* 电光蓝/青色，霓虹主色 */
            text-shadow: 0 0 5px #00ccff, 0 0 10px #0088ff; /* 基础发光效果 */
            overflow: hidden;
        }
        #clock-widget {
            background: rgba(0, 10, 40, 0.6) /* 半透明深色背景 */
            backdrop-filter: blur(10px) /* 增加磨砂玻璃效果 */
            border: 2px solid #00ffff; /* 霓虹边框 */
            box-shadow:
                0 0 20px #00ffff, /* 外围发光 */
                inset 0 0 25px rgba(0, 255, 255, 0.2); /* 内部发光 */
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 10px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #time {
            font-size: 6em; /* 放大字体 */
            margin: 0;
            font-weight: 700;
            letter-spacing: 8px;
            text-shadow:
                0 0 10px #00ffff,
                0 0 20px #0088ff,
                0 0 30px #0044ff; /* 增强发光效果 */
            display: block;
            white-space: nowrap;
            padding: 0 20px;
        }
        #date {
            font-size: 1.4em;
            margin-top: 15px;
            opacity: 0.9;
            text-shadow: 0 0 8px #00aaaa;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div id="clock-widget">
        <div id="time">--:--:--</div>
        <div id="date">-- / -- / ----</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // 1. 时间 (HH:MM:SS AM/PM)
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;

            hours = String(hours).padStart(2, '0');
            minutes = String(minutes).padStart(2, '0');
            seconds = String(seconds).padStart(2, '0');

            const timeString = `${hours}:${minutes}:${seconds} ${ampm}`;
            document.getElementById('time').textContent = timeString;

            // 2. 日期 (本地化格式)
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = now.toLocaleDateString('zh-CN', options);
            document.getElementById('date').textContent = formattedDate;
        }

        // 立即执行一次，并每秒更新
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
